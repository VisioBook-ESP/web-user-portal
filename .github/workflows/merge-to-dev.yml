name: CI

on:
  push:
    branches: [ "dev" ]

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: [ prettier, lint, type-check, test, build, health-check-dev, build-docker-image-prod ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.prod -t ghcr.io/visiobook-esp/web-user-portal-dev:latest ./

      - name: Push Docker image
        run: |
          docker push ghcr.io/visiobook-esp/web-user-portal-dev:latest


